name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor]
        required: true
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: bash .github/scripts/release.sh
  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: only-search-apk
          path: apk
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 .github/scripts/notes.py > notes.md
          mv apk/*.apk "only-search-${TAG#v}-arm64.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "only-search-${TAG#v}-arm64.apk" --clobber
