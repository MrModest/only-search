name: screenshots

# Manual: drives the launcher through its main features (ScreenshotTest) and uploads PNGs for design work.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a green 'build' run (its test-apks artifact is used)"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disk-size: 6G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p out
            for i in $(seq 60); do adb shell pm path android >/dev/null 2>&1 && adb shell cmd window size >/dev/null 2>&1 && break; sleep 5; done
            adb shell settings put global hide_error_dialogs 1
            adb shell wm size 1280x2856; adb shell wm density 495
            adb install -r $(find apks -name 'app-x86_64-release.apk')
            adb install -r $(find apks -name '*androidTest.apk')
            adb shell cmd role add-role-holder android.app.role.HOME app.onlysearch 0 || true
            adb shell appwidget grantbind --package app.onlysearch --user 0 || true
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 84 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            sleep 20
            adb shell am instrument -w -e class app.onlysearch.ScreenshotTest app.onlysearch.test/androidx.test.runner.AndroidJUnitRunner | tee out/instrument.txt
            adb pull /sdcard/Android/data/app.onlysearch/files/shots out/shots || true
            ls out/shots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: out }
