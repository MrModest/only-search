name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v0.2.$(tr -d '[:space:]' < version.txt)"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Cache toolchain and SoulverCore downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/swift-*
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
            build/dl
          key: toolchain-${{ hashFiles('bridge/env.sh') }}

      - run: ./setup.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (Swift bridge, unit tests, APKs)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          export RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12
          android/gradlew -p android testReleaseUnitTest assembleRelease assembleReleaseAndroidTest --no-daemon
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs android/app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: only-search-apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 3 # releases keep their own copy; Actions storage is small

      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            android/app/build/outputs/apk/release/app-x86_64-release.apk
            android/app/build/outputs/apk/androidTest/release/*.apk
          retention-days: 3

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: "34", target: google_apis, required: true }
          # Android 17 (37.2, google_apis_ps16k) never finished booting on GitHub runners; re-add when it does.
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: test-apks, path: apks }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p out
            for i in $(seq 60); do adb shell pm path android >/dev/null 2>&1 && adb shell cmd window size >/dev/null 2>&1 && break; sleep 5; done; adb shell getprop ro.build.version.release
            adb shell settings put global hide_error_dialogs 1
            adb shell wm size 1280x2856; adb shell wm density 495; sleep 5; adb shell wm size || true
            adb install -r $(find apks -name 'app-x86_64-release.apk')
            adb install -r $(find apks -name '*androidTest.apk')
            adb logcat -c
            adb shell am instrument -w -e class app.onlysearch.search.SoulverTest app.onlysearch.test/androidx.test.runner.AndroidJUnitRunner | tee out/instrument.txt
            adb shell am instrument -w -e class app.onlysearch.smoke.SmokeTest app.onlysearch.test/androidx.test.runner.AndroidJUnitRunner | tee out/smoke.txt
            adb logcat -d -s SoulverTest:I AndroidRuntime:E DEBUG:* linker:* | tee out/logcat.txt
            adb shell am start -W -n app.onlysearch/.MainActivity && sleep 8 && adb exec-out screencap -p > out/1-home.png
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null; sleep 1
            adb shell 'input motionevent DOWN 640 1800; for y in 1700 1600 1500 1400 1300 1200 1100 1000 900 800 700 600; do input motionevent MOVE 640 $y; done; input motionevent UP 640 600' && sleep 3 && adb exec-out screencap -p > out/2-drawer.png
            adb shell am force-stop app.onlysearch && adb shell am start -W -n app.onlysearch/.MainActivity --es query ca && sleep 6 && adb exec-out screencap -p > out/3-search.png
            adb shell am force-stop app.onlysearch && adb shell am start -W -n app.onlysearch/.MainActivity --es query "'65 kg in pounds'" && sleep 6 && adb exec-out screencap -p > out/4-calc.png
            adb logcat -d -s AndroidRuntime:E | tee out/crash.txt
            ! grep -q "Process: app.onlysearch," out/crash.txt
            grep -q "OK (" out/instrument.txt
            grep -q "OK (" out/smoke.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "emulator-results-${{ matrix.api }}", path: out, retention-days: 3 }
